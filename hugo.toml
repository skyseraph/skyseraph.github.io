baseURL = "https://skyseraph.github.io/"
languageCode = "zh-CN"
title = "SkySeraph"
theme = "skyseraph"
defaultContentLanguage = "zh"
enableRobotsTXT = true
enableEmoji = true
paginate = 10
buildFuture = true

[params]
  author = "SkySeraph"
  description = "AI for All & All for AI"
  keywords = ["AI/LLM", "APP/Android", "架构师", "SkySeraph"]
  avatar = "/images/skyseraph.png"
  github = "skyseraph"
  email = ""
  wechat = "skyseraph2020"
  since = 2015

  imageBase = "https://cdn.jsdelivr.net/gh/skyseraph/skyseraph.github.io@main/static/images"

  [params.giscus]
    enabled = true
    repo = "skyseraph/skyseraph.github.io"
    repoID = "R_kgDOJNG05w"
    category = "Announcements"
    categoryID = "DIC_kwDOJNG0584C7aUl"
    mapping = "pathname"
    theme = "light"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "专栏"
    url = "/series/"
    weight = 3
  [[menu.main]]
    name = "AI"
    url = "/ainews/"
    weight = 4
  [[menu.main]]
    name = "作品"
    url = "/projects/"
    weight = 5
  [[menu.main]]
    name = "生活"
    url = "/life/"
    weight = 6
  [[menu.main]]
    name = "闪念"
    url = "/thoughts/"
    weight = 6
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 7

[taxonomies]
  tag = "tags"
  category = "categories"
  # AI动态专栏独立标签体系（与全站 tags 隔离）
  # 注意：Hugo 要求 taxonomy 的「键名 = 值 = front matter 字段名」三者完全一致，
  #      否则 term 页不生成（键名也不要与 content 下的目录同名，会抢模板）
  ainewstags = "ainewstags"

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    lineNumbersInTable = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
